name: "CI"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Build / x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust targets and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
          mkdir -p artifacts
          mv ./target/x86_64-unknown-linux-musl/release/stalwart ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-linux-musl
          path: artifacts/stalwart

  # OpenBSD build notes (aligned with upstream FreeBSD CI + OpenBSD ports):
  # - Use ports llvm for libclang (bindgen/rocksdb). Do NOT build LLVM from source
  #   in CI — that is slow/fragile and was the main source of flaky failures.
  # - OpenBSD ports set USE_NOEXECONLY for aws-lc (s2n-bignum embeds data in .text);
  #   that maps to ld --no-execute-only, passed via RUSTFLAGS for cargo.
  # - Build under /tmp to avoid filling the small workspace disk in the VM.
  openbsd:
    name: Build / x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          mem: "14336"
          cpu: "4"
          sync: rsync
          copyback: true
          prepare: |
            set -e
            # rust: cargo toolchain
            # gmake: jemalloc-sys / rocksdb make invocations
            # llvm: libclang for bindgen (librocksdb-sys)
            # libiconv / bzip2 / protobuf: matching OpenBSD ports deps
            pkg_add rust gmake llvm libiconv bzip2 protobuf
            rustc --version
            echo "=== ports llvm ==="
            for cfg in /usr/local/llvm*/bin/llvm-config; do
              if [ -x "$cfg" ]; then
                echo "llvm-config: $cfg"
                "$cfg" --version
                echo "libdir: $($cfg --libdir)"
                ls -la "$("$cfg" --libdir)"/libclang* || true
              fi
            done
          run: |
            set -e
            export CARGO_TARGET_DIR=/tmp/target
            export CARGO_TERM_COLOR=always
            export CARGO_NET_RETRY=10
            export MAKE=gmake
            export ROCKSDB_DISABLE_SNAPPY=1
            export ROCKSDB_DISABLE_ZSTD=1
            # OpenBSD ports USE_NOEXECONLY → ld --no-execute-only (aws-lc / s2n-bignum)
            export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,--no-execute-only"
            export DEP_BZIP2_INCLUDE=/usr/local/include

            # Prefer the newest ports llvm-* (versioned under /usr/local/llvm*)
            LLVM_CONFIG=""
            for cfg in $(ls -1d /usr/local/llvm*/bin/llvm-config 2>/dev/null | sort -V | tail -1); do
              if [ -x "$cfg" ]; then
                LLVM_CONFIG="$cfg"
              fi
            done
            if [ -z "$LLVM_CONFIG" ]; then
              echo "ERROR: ports llvm-config not found (pkg_add llvm may have failed)"
              ls -la /usr/local/llvm* 2>/dev/null || true
              exit 1
            fi

            LIBCLANG_PATH="$($LLVM_CONFIG --libdir)"
            if ! ls "$LIBCLANG_PATH"/libclang*.so* >/dev/null 2>&1; then
              echo "ERROR: libclang shared library not found under $LIBCLANG_PATH"
              ls -la "$LIBCLANG_PATH" || true
              exit 1
            fi
            export LIBCLANG_PATH
            export LD_LIBRARY_PATH="$LIBCLANG_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

            CLANG_BIN="$(dirname "$LLVM_CONFIG")/clang"
            CLANGPP_BIN="$(dirname "$LLVM_CONFIG")/clang++"
            if [ ! -x "$CLANG_BIN" ]; then
              CLANG_BIN=/usr/bin/clang
              CLANGPP_BIN=/usr/bin/clang++
            fi
            export CC="$CLANG_BIN"
            export CXX="$CLANGPP_BIN"
            echo "CC=$CC CXX=$CXX LIBCLANG_PATH=$LIBCLANG_PATH RUSTFLAGS=$RUSTFLAGS"

            cargo build --release -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"

            mkdir -p artifacts
            cp /tmp/target/release/stalwart artifacts/stalwart
            file artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-openbsd
          path: artifacts/stalwart

  release:
    name: Release
    permissions:
      id-token: write
      contents: write
      attestations: write
    needs: [linux, openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: archive
          pattern: artifact-*

      - name: Prepare release
        id: prep
        run: |
          set -eux
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          mkdir -p dist
          tar -czf dist/stalwart-x86_64-unknown-linux-musl.tar.gz -C archive/artifact-x86_64-unknown-linux-musl stalwart
          tar -czf dist/stalwart-x86_64-unknown-openbsd.tar.gz -C archive/artifact-x86_64-unknown-openbsd stalwart

      - name: Attest binary
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Use cosign to sign
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: dist/*.tar.gz

      - name: Build release body
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## Commit ${{ github.sha }}" > release_body.md
            echo "" >> release_body.md
          fi
          cat >> release_body.md <<EOF
          <hr />

          ### Check binary attestation [here](${{ steps.attest.outputs.attestation-url }})
          EOF

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', steps.prep.outputs.short_sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', steps.prep.outputs.short_sha) }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: release_body.md

  cleanup:
    name: Cleanup failed release
    needs: [linux, openbsd, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-$SHORT_SHA"
          fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
