name: "CI"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Build / x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust targets and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
          mkdir -p artifacts
          mv ./target/x86_64-unknown-linux-musl/release/stalwart ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-linux-musl
          path: artifacts/stalwart

  openbsd:
    name: Build / x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          prepare: |
            # 安装编译工具
            pkg_add -v -D unsigned cmake ninja python3 git curl gmake libiconv
            
            # ===== 从源码编译 libclang.so =====
            # OpenBSD 7.9 的 llvm-19 包只提供编译器前端，不提供 libclang 共享库。
            # rocksdb 的 bindgen 必须加载 libclang.so，别无他法。
            echo "=== Building libclang.so from LLVM 19.1.7 source ==="
            mkdir -p /tmp/llvm-build && cd /tmp/llvm-build
            
            # 下载与 OpenBSD 7.9 base 系统同版本的 LLVM 源码
            curl -L -o llvm-src.tar.xz \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/llvm-project-19.1.7.src.tar.xz
            tar -xf llvm-src.tar.xz
            cd llvm-project-19.1.7.src
            
            # 最小化配置：只编译 host 架构，关闭所有可选功能
            cmake -S llvm -B build \
              -G Ninja \
              -DLLVM_ENABLE_PROJECTS=clang \
              -DBUILD_SHARED_LIBS=ON \
              -DLLVM_TARGETS_TO_BUILD=host \
              -DLLVM_ENABLE_ASSERTIONS=OFF \
              -DLLVM_ENABLE_BACKTRACES=OFF \
              -DLLVM_ENABLE_LIBEDIT=OFF \
              -DLLVM_ENABLE_LIBXML2=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF \
              -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF \
              -DCLANG_ENABLE_ARCMT=OFF \
              -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
              -DCMAKE_BUILD_TYPE=Release
            
            # 只编译 libclang 及其依赖（不编译 clang 工具）
            ninja -C build libclang
            
            # 收集所有生成的共享库到统一目录
            mkdir -p /usr/local/llvm-custom/lib
            cp build/lib/libclang.so* /usr/local/llvm-custom/lib/ 2>/dev/null || true
            cp build/lib/libclang-cpp.so* /usr/local/llvm-custom/lib/ 2>/dev/null || true
            cp build/lib/libLLVM*.so* /usr/local/llvm-custom/lib/ 2>/dev/null || true
            
            echo "=== libclang build complete ==="
            ls -la /usr/local/llvm-custom/lib/
            
          run: |
            set -ex
            
            # 指向刚编译的 libclang.so
            export LIBCLANG_PATH=/usr/local/llvm-custom/lib
            export LD_LIBRARY_PATH=/usr/local/llvm-custom/lib:$LD_LIBRARY_PATH
            
            # 用 base 系统的 clang 作为 C/C++ 编译器
            export CC=/usr/bin/clang
            export CXX=/usr/bin/clang++
            
            # rocksdb 在 OpenBSD 上的 workaround
            export MAKE=gmake
            export ROCKSDB_DISABLE_SNAPPY=1
            export ROCKSDB_DISABLE_ZSTD=1
            
            cargo build --release -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
            
            mkdir -p artifacts
            cp ./target/release/stalwart ./artifacts/stalwart
            file ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-openbsd
          path: artifacts/stalwart

  release:
    name: Release
    permissions:
      id-token: write
      contents: write
      attestations: write
    needs: [linux, openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: archive
          pattern: artifact-*

      - name: Prepare release
        id: prep
        run: |
          set -eux
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          mkdir -p dist
          tar -czf dist/stalwart-x86_64-unknown-linux-musl.tar.gz -C archive/artifact-x86_64-unknown-linux-musl stalwart
          tar -czf dist/stalwart-x86_64-unknown-openbsd.tar.gz -C archive/artifact-x86_64-unknown-openbsd stalwart

      - name: Attest binary
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Use cosign to sign
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: dist/*.tar.gz

      - name: Build release body
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## Commit ${{ github.sha }}" > release_body.md
            echo "" >> release_body.md
          fi
          cat >> release_body.md <<EOF
          <hr />

          ### Check binary attestation [here](${{ steps.attest.outputs.attestation-url }})
          EOF

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', steps.prep.outputs.short_sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', steps.prep.outputs.short_sha) }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: release_body.md

  cleanup:
    name: Cleanup failed release
    needs: [linux, openbsd, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-$SHORT_SHA"
          fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
