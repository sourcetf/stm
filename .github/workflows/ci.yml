name: "CI"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Build / x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust targets and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
          mkdir -p artifacts
          mv ./target/x86_64-unknown-linux-musl/release/stalwart ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-linux-musl
          path: artifacts/stalwart

  openbsd:
    name: Build / x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          prepare: |
            # 非交互模式强制安装，-v 看详情，-D unsigned 跳过签名问题（ports 包有时签名不匹配）
            pkg_add -v -D unsigned llvm cmake gmake libiconv || true
            
            # 验证 llvm 到底装了什么版本、文件在哪
            echo "=== installed llvm packages ==="
            pkg_info | grep -i llvm || true
            
            echo "=== pkg_info file list (clang related) ==="
            pkg_info -L llvm 2>/dev/null | grep -i clang | head -20 || true
            pkg_info -L llvm-19 2>/dev/null | grep -i clang | head -20 || true
            pkg_info -L llvm-21 2>/dev/null | grep -i clang | head -20 || true
            
            echo "=== find all libclang* files ==="
            find /usr/local -name "libclang*" -o -name "libclang-cpp*" 2>/dev/null | head -20 || true
            find /usr/lib -name "libclang*" 2>/dev/null | head -20 || true
            
            echo "=== llvm-config versions ==="
            /usr/bin/llvm-config --version 2>/dev/null || true
            /usr/local/llvm*/bin/llvm-config --version 2>/dev/null || true
            
          run: |
            set -ex
            # 不要 -u，避免未定义变量炸掉
            
            # ===== 多层 fallback 找 libclang =====
            LIBCLANG_PATH=""
            
            # 1. 用 ports 的 llvm-config 找
            for cfg in /usr/local/llvm*/bin/llvm-config; do
              if [ -x "$cfg" ]; then
                dir=$($cfg --libdir 2>/dev/null)
                if [ -n "$dir" ] && ls "$dir"/libclang* >/dev/null 2>&1; then
                  LIBCLANG_PATH="$dir"
                  echo "Found libclang via $cfg: $LIBCLANG_PATH"
                  break
                fi
              fi
            done
            
            # 2. 手动搜 /usr/local/llvm*/lib/
            if [ -z "$LIBCLANG_PATH" ]; then
              for so in /usr/local/llvm*/lib/libclang*; do
                if [ -f "$so" ]; then
                  LIBCLANG_PATH=$(dirname "$so")
                  echo "Found libclang manually: $LIBCLANG_PATH"
                  break
                fi
              done
            fi
            
            # 3. 回退到 /usr/local/lib（旧路径，某些版本可能还在）
            if [ -z "$LIBCLANG_PATH" ] && ls /usr/local/lib/libclang* >/dev/null 2>&1; then
              LIBCLANG_PATH=/usr/local/lib
              echo "Found libclang at old path: $LIBCLANG_PATH"
            fi
            
            # 4. 回退到 base 系统的 /usr/lib（OpenBSD 7.9 base 自带 LLVM 19.1.7）
            if [ -z "$LIBCLANG_PATH" ] && ls /usr/lib/libclang* >/dev/null 2>&1; then
              LIBCLANG_PATH=/usr/lib
              echo "Found libclang in base system: $LIBCLANG_PATH"
            fi
            
            if [ -z "$LIBCLANG_PATH" ]; then
              echo "ERROR: libclang not found anywhere"
              exit 1
            fi
            
            export LIBCLANG_PATH
            # 安全设置 LD_LIBRARY_PATH
            if [ -n "${LD_LIBRARY_PATH:-}" ]; then
              export LD_LIBRARY_PATH="$LIBCLANG_PATH:$LD_LIBRARY_PATH"
            else
              export LD_LIBRARY_PATH="$LIBCLANG_PATH"
            fi
            
            # CC/CXX 指向 ports 的 clang，如果没有就用 base 的
            for clang in /usr/local/llvm*/bin/clang /usr/bin/clang; do
              if [ -x "$clang" ]; then
                export CC="$clang"
                export CXX="${clang}++"
                echo "CC=$CC CXX=$CXX"
                break
              fi
            done
            
            # rocksdb 在 OpenBSD 上的 workaround
            export MAKE=gmake
            export ROCKSDB_DISABLE_SNAPPY=1
            export ROCKSDB_DISABLE_ZSTD=1
            
            cargo build --release -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
            
            mkdir -p artifacts
            cp ./target/release/stalwart ./artifacts/stalwart
            file ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-openbsd
          path: artifacts/stalwart

  release:
    name: Release
    permissions:
      id-token: write
      contents: write
      attestations: write
    needs: [linux, openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: archive
          pattern: artifact-*

      - name: Prepare release
        id: prep
        run: |
          set -eux
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          mkdir -p dist
          tar -czf dist/stalwart-x86_64-unknown-linux-musl.tar.gz -C archive/artifact-x86_64-unknown-linux-musl stalwart
          tar -czf dist/stalwart-x86_64-unknown-openbsd.tar.gz -C archive/artifact-x86_64-unknown-openbsd stalwart

      - name: Attest binary
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Use cosign to sign
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: dist/*.tar.gz

      - name: Build release body
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## Commit ${{ github.sha }}" > release_body.md
            echo "" >> release_body.md
          fi
          cat >> release_body.md <<EOF
          <hr />

          ### Check binary attestation [here](${{ steps.attest.outputs.attestation-url }})
          EOF

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', steps.prep.outputs.short_sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', steps.prep.outputs.short_sha) }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: release_body.md

  cleanup:
    name: Cleanup failed release
    needs: [linux, openbsd, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-$SHORT_SHA"
          fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
