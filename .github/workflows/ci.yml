name: "CI"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一个 ref 上只让最新一次跑：否则后来的运行会一直 pending 排队
  # （OpenBSD job 要 ~90 分钟，排队等一次几乎等于半天）。
  # 需要并行验证时请推到一个独立分支——不同 ref 属于不同 concurrency 组。
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Build / x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust targets and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
          mkdir -p artifacts
          mv ./target/x86_64-unknown-linux-musl/release/stalwart ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-linux-musl
          path: artifacts/stalwart

  # OpenBSD notes:
  # - OpenBSD 7.9 ships llvm branches 19/20/21. Bare `pkg_add llvm` is ambiguous
  #   and fails non-interactively (~2m, "ssh exited with code 1").
  #   Branch pin is `llvm%19` (pkg_add(1) "pkgname%branch"), NOT `llvm-19`
  #   (that looks like stem llvm-19 and fails immediately).
  # - OpenBSD ports USE_NOEXECONLY maps to ld --no-execute-only (aws-lc/s2n-bignum).
  # - Build under /tmp; use fixed /usr/local/llvm19 paths (no GNU sort -V).
  # - Cargo.toml [profile.release] is lto=true + codegen-units=1; fat LTO OOMs
  #   rustc/LLVM in an 8G VM (run 33350821470). Use ~14G + swap and LTO=off here.
  # - Final link of stalwart still OOMs with LTO off: disable link-time strip,
  #   use ld.lld, opt-level=1, jobs=1, and adaptive VM swap (disk is small;
  #   a fixed 24G dd ENOSPCs after ~15G).
  # - Snapshots packages (rust 1.98) target -current, not 7.9 stable; use 7.9
  #   rust 1.94.1, which is enough to build stalwart today.
  openbsd:
    name: Build / x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # QEMU VM mem: 14336 leaves little headroom on 16G runners; host swap avoids thrashing.
      - name: Add host swap
        run: |
          set -eux
          if ! swapon --show | grep -q /mnt/swapfile; then
            sudo fallocate -l 16G /mnt/swapfile 2>/dev/null || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384 status=progress
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h
          swapon --show

      # 跨 run 缓存。VM 每次都是全新的，所以缓存必须放在宿主的
      # /home/runner/work 下：vmactions 会把这个目录整体 rsync 进 VM，构建完再
      # copyback 回来，于是 actions/cache 能把它存下来。
      # 用 restore/save 拆开的两步，这样能只在构建成功时才写缓存。
      #
      # key 只用 Cargo.lock 的哈希（不带 run_id）：命中就跳过保存，依赖没变就一直
      # 复用同一份；依赖变了 key 变、靠 restore-keys 前缀复用旧 target，cargo 自己
      # 判断哪些 unit 还有效。带 run_id 的话每次都会存一份新的 ~5G 缓存，两次就把
      # 仓库的 10G 配额挤爆并触发 LRU 淘汰。
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/work/cargo-cache/.cargo
            /home/runner/work/cargo-cache/target
          key: openbsd-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            openbsd-cargo-

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          mem: 14336
          cpu: 4
          sync: rsync
          copyback: true
          prepare: |
            set -e
            RELEASE_PKG="https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64"
            # -Iv: never prompt. llvm%19 = devel/llvm/19 (libclang). rust = 1.94.1 on 7.9.
            pkg_add -Iv -m "$RELEASE_PKG" rust gmake "llvm%19" libiconv bzip2 protobuf cmake
            rustc --version
            test -x /usr/local/llvm19/bin/ld.lld
            # Adaptive swap: VM disk is ~small; fixed 24G ENOSPCs after ~15G.
            # Leave headroom for cargo target dir on the same filesystem.
            df -h / /var /tmp /home || true
            swapctl -d /var/swap.img 2>/dev/null || true
            rm -f /var/swap.img
            FREE_MB=$(df -k /var | awk 'NR==2 {print int($4/1024)}')
            RESERVE_MB=8192
            SWAP_MB=$((FREE_MB - RESERVE_MB))
            if [ "$SWAP_MB" -gt 12288 ]; then SWAP_MB=12288; fi
            if [ "$SWAP_MB" -lt 2048 ]; then
              echo "ERROR: only ${FREE_MB}MB free on /var; need >=10GB free for swap+build"
              df -h /
              exit 1
            fi
            echo "Creating ${SWAP_MB}MB swap (free=${FREE_MB}MB, reserve=${RESERVE_MB}MB)"
            dd if=/dev/zero of=/var/swap.img bs=1m count="$SWAP_MB"
            chmod 600 /var/swap.img
            swapctl -a /var/swap.img
            swapctl -l || true
            ulimit -a || true
            df -h / /var /tmp || true
            /usr/local/llvm19/bin/llvm-config --version
            /usr/local/llvm19/bin/llvm-config --libdir
            ls -la /usr/local/llvm19/lib/libclang.so*
          run: |
            set -e
            ulimit -d unlimited 2>/dev/null || ulimit -d hard
            # 跨 run 缓存目录：宿主上 /home/runner/work 会被 rsync 进 VM（VM 内是同一
            # 绝对路径），构建完再 copyback 回宿主，交给后面的 actions/cache/save。
            # 放在 /home 下（113G）——VM 根分区只有 986M。
            CACHE_ROOT=/home/runner/work/cargo-cache
            mkdir -p "$CACHE_ROOT"
            export CARGO_HOME="$CACHE_ROOT/.cargo"
            export CARGO_TARGET_DIR="$CACHE_ROOT/target"
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
            echo "cache size on entry: $(du -sh "$CACHE_ROOT" 2>/dev/null | cut -f1)"
            if [ -f "$CARGO_TARGET_DIR/release/stalwart" ]; then
              echo "previous build artifact present: $(ls -lh "$CARGO_TARGET_DIR/release/stalwart" | awk '{print $5}')"
            fi
            df -h /home | tail -1
            export CARGO_TERM_COLOR=always
            export CARGO_INCREMENTAL=0
            export MAKE=gmake
            export ROCKSDB_DISABLE_SNAPPY=1
            export ROCKSDB_DISABLE_ZSTD=1
            # OpenBSD ports USE_NOEXECONLY -> ld --no-execute-only (aws-lc / s2n-bignum)
            # 7.9 的 pkg rust 是 1.94.1，而 v1.0 用到了 1.95/1.98 才稳定的特性：
            #   lock_api/parking_lot* 的 cfg_select、ptr_as_ref_unchecked、atomic_try_update，
            #   common 的 if-let guard。
            # 用 RUSTC_BOOTSTRAP=1 + -Zcrate-attr 打开这些 gate；已用 1.94.1 在本地
            # 全量 cargo check -p stalwart（含 enterprise 等全部 feature）验证可编过。
            # 注意：-Zcrate-attr 会注入到所有 crate（含 no_std 依赖），而 push_mut 这类
            # 依赖 std 的特性在 no_std crate 里会被判为 unknown feature（E0635），
            # 所以 groupware 里那两处 push_mut 改成等价的 push + 索引。
            export RUSTC_BOOTSTRAP=1
            export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,--no-execute-only -C link-arg=-fuse-ld=lld -C debuginfo=0 -Zcrate-attr=feature(cfg_select) -Zcrate-attr=feature(ptr_as_ref_unchecked) -Zcrate-attr=feature(atomic_try_update) -Zcrate-attr=feature(if_let_guard)"
            export DEP_BZIP2_INCLUDE=/usr/local/include
            # Cargo.toml release: lto=true, codegen-units=1, strip=true, opt-level=3.
            # Lower opt-level + no link-time strip to keep final link within RAM+swap.
            export CARGO_PROFILE_RELEASE_LTO=off
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            export CARGO_PROFILE_RELEASE_STRIP=false
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=1
            # JOBS=1 曾是防 OOM 的保险，但代价是 574 个 crate 串行编译 ~64 分钟。
            # 这台 VM 有 15G 内存 + 6.8G swap，实测最吃内存的单个单元（librocksdb-sys
            # 的 C++ 构建、final link）也不到 6G，所以放到 min(vCPU, 4)。
            # 并行度带来的额外峰值主要来自多个 rustc 同时跑；如果真撞上 OOM，
            # 下面的第二次构建会用 JOBS=1 接着编（已完成单元全部命中缓存，不会重来）。
            JOBS=$(sysctl -n hw.ncpu 2>/dev/null || echo 2)
            if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
            if [ "$JOBS" -lt 2 ]; then JOBS=2; fi
            export CARGO_BUILD_JOBS="$JOBS"

            LLVM_CONFIG=/usr/local/llvm19/bin/llvm-config
            if [ ! -x "$LLVM_CONFIG" ]; then
              echo "ERROR: $LLVM_CONFIG missing after pkg_add llvm%19"
              ls -la /usr/local/llvm* 2>/dev/null || true
              exit 1
            fi
            if [ ! -x /usr/local/llvm19/bin/ld.lld ]; then
              echo "ERROR: ld.lld missing; needed for lower-memory final link"
              exit 1
            fi

            LIBCLANG_PATH="$($LLVM_CONFIG --libdir)"
            if ! ls "$LIBCLANG_PATH"/libclang.so* >/dev/null 2>&1; then
              echo "ERROR: libclang.so not found under $LIBCLANG_PATH"
              ls -la "$LIBCLANG_PATH" || true
              exit 1
            fi
            export LIBCLANG_PATH
            export LD_LIBRARY_PATH="$LIBCLANG_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

            export CC=/usr/local/llvm19/bin/clang
            export CXX=/usr/local/llvm19/bin/clang++
            echo "CC=$CC CXX=$CXX LIBCLANG_PATH=$LIBCLANG_PATH RUSTFLAGS=$RUSTFLAGS"
            echo "rustc=$(rustc --version) LTO=$CARGO_PROFILE_RELEASE_LTO CGU=$CARGO_PROFILE_RELEASE_CODEGEN_UNITS OPT=$CARGO_PROFILE_RELEASE_OPT_LEVEL STRIP=$CARGO_PROFILE_RELEASE_STRIP JOBS=$CARGO_BUILD_JOBS"
            sysctl hw.physmem vm.swap_enabled vm.nswapdev || true
            swapctl -l || true
            df -h /tmp /var || true

            # OpenBSD 7.9 的 pkg rust 是 1.94.1，而 v1.0 的依赖（mail-parser 1.0.1 等）
            # 声明 rust-version = 1.98；先忽略这个元数据检查，看代码能否真的编过。
            stamp() { echo "=== $* at $(date -u +%H:%M:%S) ==="; }
            stamp "build start (jobs=$CARGO_BUILD_JOBS)"

            build_once() {
              cargo build --release --ignore-rust-version -p stalwart \
                --no-default-features \
                --features "sqlite postgres mysql rocks s3 redis azure nats enterprise" 2>&1
            }

            # 并行构建先试一把。只有在明确是“内存/磁盘不够”时才降级重试：
            # 真正的编译错误重试一遍纯属浪费一小时（之前每次失败都这样）。
            # 退出码用哨兵文件带出来：管道的 $? 是 tee 的，POSIX sh 没有 PIPESTATUS；
            # 子 shell 里 set -e 会抢在写哨兵文件之前 abort，所以显式 set +e。
            set +e
            ( set +e; build_once; echo $? > "$CACHE_ROOT/rc" ) 2>&1 | tee "$CACHE_ROOT/build.log"
            rc=$(tr -d '[:space:]' < "$CACHE_ROOT/rc" 2>/dev/null)
            rc=${rc:-1}
            set -e
            if [ "$rc" -ne 0 ] && grep -qiE "signal: 9|SIGKILL|killed|cannot allocate|memory allocation|out of memory|no space left|out of swap" "$CACHE_ROOT/build.log"; then
              echo "::warning::parallel build died from resource exhaustion; retrying serially (cached units are reused)"
              swapctl -l || true
              stamp "serial retry (jobs=1)"
              CARGO_BUILD_JOBS=1 cargo build --release --ignore-rust-version -p stalwart \
                --no-default-features \
                --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            stamp "build done"

            test -x "$CARGO_TARGET_DIR/release/stalwart"

            # 沙箱冒烟测试：unveil/pledge 能正常应用（承诺集有问题时进程会被内核杀掉）
            "$CARGO_TARGET_DIR/release/stalwart" --sandbox-check

            # 沙箱矩阵不在这里跑：它需要真实的多场景重启，放到独立的
            # sandbox-matrix.yml（拿本 job 的制品在干净 VM 里跑），这样改一行
            # 测试脚本不必重编 2.5 小时。

            strip "$CARGO_TARGET_DIR/release/stalwart"
            mkdir -p artifacts
            cp "$CARGO_TARGET_DIR/release/stalwart" artifacts/stalwart
            file artifacts/stalwart
            ls -lh artifacts/stalwart

            # 缓存瘦身，否则 actions/cache 存不下（仓库配额 10 GB，单条也有上限）。
            # 保留增量编译真正需要的东西：
            #   * .cargo/registry/cache  .crate 原始包（压缩过，比解包后的 src 小）
            #     解包目录 registry/src 删掉，下次由 cargo 从 cache 重新解包
            #   * .cargo/git             git 依赖的 checkout
            #   * target/release/{deps,build,.fingerprint}  各 rlib 与指纹
            #       ├─ build/ 里有 librocksdb-sys 的 C++ 产物——正是最慢的单元（20+ 分钟）
            #       └─ 这些必须留着，否则缓存等于白做
            # 删掉：旧的最终二进制、examples/tests、debug。实测缓存体积见上面的日志。
            rm -rf "$CARGO_TARGET_DIR"/{debug,examples,tests} 2>/dev/null || true
            rm -rf "$CARGO_TARGET_DIR"/release/{examples,tests} 2>/dev/null || true
            rm -rf "$CARGO_HOME"/registry/src 2>/dev/null || true
            rm -f "$CACHE_ROOT"/build.log "$CACHE_ROOT"/rc 2>/dev/null || true
            echo "cache size on exit: $(du -sh "$CACHE_ROOT" 2>/dev/null | cut -f1)"
            du -sh "$CACHE_ROOT"/.cargo "$CACHE_ROOT"/target 2>/dev/null || true
            du -sh "$CARGO_TARGET_DIR"/release/{deps,build,.fingerprint} 2>/dev/null || true

      # 只在上一步（VM 里的构建）成功时才写缓存：失败时的 target 目录可能是半成品，
      # 存下来会污染下次。命中已有的 key 就不用再存。超配额或体积超限也只该影响
      # 下次速度，所以加 continue-on-error。
      - name: Save cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/work/cargo-cache/.cargo
            /home/runner/work/cargo-cache/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-openbsd
          path: artifacts/stalwart

  release:
    name: Release
    # 只在 main / tag 上发布；在其它分支上手动跑 CI（验证构建）时不要产出 release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: write
      attestations: write
    needs: [linux, openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: archive
          pattern: artifact-*

      - name: Prepare release
        id: prep
        run: |
          set -eux
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          mkdir -p dist
          tar -czf dist/stalwart-x86_64-unknown-linux-musl.tar.gz -C archive/artifact-x86_64-unknown-linux-musl stalwart
          tar -czf dist/stalwart-x86_64-unknown-openbsd.tar.gz -C archive/artifact-x86_64-unknown-openbsd stalwart

      - name: Attest binary
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Use cosign to sign
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: dist/*.tar.gz

      - name: Build release body
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## Commit ${{ github.sha }}" > release_body.md
            echo "" >> release_body.md
          fi
          cat >> release_body.md <<EOF
          <hr />

          ### Check binary attestation [here](${{ steps.attest.outputs.attestation-url }})
          EOF

      # 同一个 commit 重复跑 CI 时（重试、重复 push、手动 dispatch），release 已经
      # 发布过了。GitHub 的 immutable release 不允许删/改已发布的 asset，原来的
      # 流程会在这里报 "Cannot delete asset from an immutable release" 而失败。
      # 这种失败没有意义（产物已经在），所以先探测再决定要不要发。
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${{ steps.prep.outputs.short_sha }}"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release $TAG already exists (immutable); skipping re-upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', steps.prep.outputs.short_sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', steps.prep.outputs.short_sha) }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: release_body.md

  cleanup:
    name: Cleanup failed release
    needs: [linux, openbsd, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 只清理**草稿**。这个 job 原本见 failure 就 `gh release delete`，
      # 而已发布的 release 在本仓库是 immutable：重跑一次 CI（release 步骤因为
      # "Cannot delete asset from an immutable release" 失败）就会把上一份正常
      # 发布的产物连带 tag 一起删掉，而且删掉后 tag 名被 GitHub 记住、再也建不
      # 回来（"tag_name was used by an immutable release"）。
      - name: Delete failed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-$SHORT_SHA"
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$IS_DRAFT" = "true" ]; then
            echo "deleting orphaned draft release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          else
            echo "::notice::release $TAG is published (or absent); leaving it untouched"
          fi
