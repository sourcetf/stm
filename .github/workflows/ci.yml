name: "CI"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Build / x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust targets and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
          mkdir -p artifacts
          mv ./target/x86_64-unknown-linux-musl/release/stalwart ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-linux-musl
          path: artifacts/stalwart

  openbsd:
    name: Build / x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add rust cmake gmake llvm libiconv
            # 确认 llvm 版本和 libclang 位置
            echo "=== llvm-config --version ==="
            llvm-config --version || true
            echo "=== llvm-config --libdir ==="
            llvm-config --libdir || true
            echo "=== libclang files ==="
            ls -la /usr/local/llvm*/lib/libclang* 2>/dev/null || true
          run: |
            set -ex
            # 不要 -u，LD_LIBRARY_PATH 可能未定义
            
            # ===== 修复 1: 用 llvm-config 拿 libclang 路径 =====
            if llvm-config --libdir >/dev/null 2>&1; then
              export LIBCLANG_PATH=$(llvm-config --libdir)
              echo "LIBCLANG_PATH from llvm-config: $LIBCLANG_PATH"
            else
              # fallback: 直接猜 OpenBSD 7.9 是 llvm21
              export LIBCLANG_PATH=/usr/local/llvm21/lib
              echo "LIBCLANG_PATH fallback: $LIBCLANG_PATH"
            fi
            
            # ===== 修复 2: LD_LIBRARY_PATH 安全拼接 =====
            if [ -n "${LD_LIBRARY_PATH:-}" ]; then
              export LD_LIBRARY_PATH="$LIBCLANG_PATH:$LD_LIBRARY_PATH"
            else
              export LD_LIBRARY_PATH="$LIBCLANG_PATH"
            fi
            
            # ===== 修复 3: CC/CXX 指向 pkg_add 的 clang =====
            # OpenBSD 7.9 自带 base clang 在 /usr/bin，但 pkg_add llvm 装的是新版本
            # 用 llvm-config 同目录的 clang 最保险
            CLANG_BIN=$(find /usr/local/llvm*/bin -name "clang" 2>/dev/null | head -1)
            CLANGPP_BIN=$(find /usr/local/llvm*/bin -name "clang++" 2>/dev/null | head -1)
            if [ -n "$CLANG_BIN" ]; then
              export CC="$CLANG_BIN"
              export CXX="$CLANGPP_BIN"
              echo "CC=$CC CXX=$CXX"
            fi
            
            # rocksdb 在 OpenBSD 上的 workaround
            export MAKE=gmake
            export ROCKSDB_DISABLE_SNAPPY=1
            export ROCKSDB_DISABLE_ZSTD=1
            
            cargo build --release -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis azure nats enterprise"
            
            mkdir -p artifacts
            cp ./target/release/stalwart ./artifacts/stalwart
            file ./artifacts/stalwart

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-x86_64-unknown-openbsd
          path: artifacts/stalwart

  release:
    name: Release
    permissions:
      id-token: write
      contents: write
      attestations: write
    needs: [linux, openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: archive
          pattern: artifact-*

      - name: Prepare release
        id: prep
        run: |
          set -eux
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          mkdir -p dist
          tar -czf dist/stalwart-x86_64-unknown-linux-musl.tar.gz -C archive/artifact-x86_64-unknown-linux-musl stalwart
          tar -czf dist/stalwart-x86_64-unknown-openbsd.tar.gz -C archive/artifact-x86_64-unknown-openbsd stalwart

      - name: Attest binary
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Use cosign to sign
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: dist/*.tar.gz

      - name: Build release body
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## Commit ${{ github.sha }}" > release_body.md
            echo "" >> release_body.md
          fi
          cat >> release_body.md <<EOF
          <hr />

          ### Check binary attestation [here](${{ steps.attest.outputs.attestation-url }})
          EOF

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', steps.prep.outputs.short_sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', steps.prep.outputs.short_sha) }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: release_body.md

  cleanup:
    name: Cleanup failed release
    needs: [linux, openbsd, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-$SHORT_SHA"
          fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
