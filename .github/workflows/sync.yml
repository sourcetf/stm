name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Add upstream and sync
        run: |
          git remote add upstream https://github.com/sourcetf/stalwart.git
          git fetch upstream
          git checkout main
          git diff --name-only --diff-filter=U | grep '\.md$' | xargs -r -I{} git rm -f {} 2>/dev/null || true
          git checkout HEAD -- '*.md' 2>/dev/null || true
          git ls-files --deleted '*.md' | xargs -r git rm -f 2>/dev/null || true
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded without conflicts"
          else
            echo "Merge conflicts detected, resolving automatically..."
            git checkout --ours .github/workflows/ci.yml
            git add .github/workflows/ci.yml
            git checkout --ours .github/workflows/sync.yml
            git add .github/workflows/sync.yml
            git commit -m "Sync upstream (auto-resolved conflicts)"
          fi
          git push origin main
