name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Add upstream and sync
        run: |
          git remote add upstream https://github.com/sourcetf/stalwart.git
          git fetch upstream
          git checkout main
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded without conflicts"
          else
            echo "Merge conflicts detected, resolving automatically..."
            git diff --name-only --diff-filter=U | grep '\.md$' | while read -r file; do
              echo "Resolving .md conflict: accepting local deletion for $file"
              git rm -f "$file" || true
            done
            git checkout --ours .github/workflows/ci.yml 2>/dev/null || true
            git add .github/workflows/ci.yml 2>/dev/null || true
            git checkout --ours .github/workflows/sync.yml 2>/dev/null || true
            git add .github/workflows/sync.yml 2>/dev/null || true
            git commit -m "Sync upstream (auto-resolved conflicts)" || echo "Nothing to commit"
          fi
          git push origin main
